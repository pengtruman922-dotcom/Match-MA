[build]
builder = "NIXPACKS"
watchPatterns = [
  # 只有影响后端运行时的路径才触发重建。tests/ 不随镜像发布、
  # deploy/ 只服务自建、docs 与 平台优化方案 是文档，都不该触发。
  # railway*.toml 用通配：4 个后端服务到底读哪一个配置文件由面板决定，
  # 通配可以保证「改到自己那份」一定会重建。
  "backend/**",
  "scripts/**",
  "alembic/**",
  "alembic.ini",
  "database/**",
  "pyproject.toml",
  "railway*.toml",
]

[deploy]
# 调研任务单次 5~15 分钟，stale 窗口必须大于它。任务最多尝试 3 次，
# 但代码只允许限流、超时和临时网络故障重试，业务/配置错误会立即终止。
# 并发通过 Railway 面板将本服务 Replicas 配为 5；每个副本仍只跑一个任务。
startCommand = "python -m backend.app.worker --queue research --sleep 5 --stale-after 1800"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
