name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q

  migrations:
    name: Fresh database from baseline
    runs-on: ubuntu-latest
    services:
      postgres:
        # 不是官方 postgres 镜像：baseline 需要 pgvector（官方镜像不带）
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: match_ma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/match_ma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Apply the baseline to a fresh database
        run: python -m alembic upgrade 20260722_0048
      - name: Compare the fresh schema against the production snapshot
        run: python scripts/verify_schema_against_snapshot.py
      - name: Apply any migrations after the baseline
        run: python -m alembic upgrade head
      # 队列的 SQL 只有真库能验：jsonb_build_object 里的裸参数在 Postgres 上会
      # 抛 AmbiguousParameter，而那条语句是 worker 记录失败用的 —— 崩了就等于
      # 任何任务失败都会带走 worker 进程。
      - name: Exercise the job-queue SQL against the fresh database
        run: python -m pytest tests/test_job_queue_sql.py -q
      # 初筛的硬筛 SQL 同理：三值逻辑、count(*) filter 的淘汰拆分、jsonb 展开
      # 都只有真库能验。用例把 71 条生产标的快照灌进这个空库后逐条断言命中数。
      - name: Exercise the screening SQL against the fresh database
        run: python -m pytest tests/test_screening_sql.py -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
