[build]
builder = "NIXPACKS"
watchPatterns = [
  # 只有影响后端运行时的路径才触发重建。tests/ 不随镜像发布、
  # deploy/ 只服务自建、docs 与 平台优化方案 是文档，都不该触发。
  # railway*.toml 用通配：4 个后端服务到底读哪一个配置文件由面板决定，
  # 通配可以保证「改到自己那份」一定会重建。
  "backend/**",
  "scripts/**",
  "alembic/**",
  "alembic.ini",
  "database/**",
  "pyproject.toml",
  "railway*.toml",
]

[deploy]
# 推荐 Agent 一轮跑满工具预算可以超过 5 分钟。stale 窗口留在默认 300s 会让
# 还在干活的任务被判死（agent 任务 max_attempts=1，判死即 failed，不会重跑，
# 但用户会看到一轮失败的推荐）。窗口必须盖得住队列里最慢的任务。
startCommand = "python -m backend.app.worker --queue llm --sleep 2 --stale-after 1800"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
